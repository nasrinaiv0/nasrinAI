name: Tests and security checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/elevenlabs-developer-plugin

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full test suite
        run: npm test
      - name: Scan for secrets
        run: npm run check:secrets
      - name: Check modified JavaScript syntax
        run: |
          node --check src/elevenlabs.js
          node --check src/video-studio-export.js
          node --check src/routes.js
          node --check src/main.js
          node --check src/store/memory-store.js
          node --check src/store/supabase-store.js
          node --check public/app.js
          node --check public/studio/studio.js
