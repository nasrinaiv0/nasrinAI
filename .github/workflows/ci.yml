name: CI

on:
  push:
    branches: [main, development, 'feature/**', 'security/**', 'feat/**']
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # The committed lockfile must match package.json (no lifecycle scripts run).
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code package-lock.json
      - run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # Rebuild only the pinned FFmpeg dependency; keep other lifecycle scripts disabled.
      - run: npm rebuild ffmpeg-static --no-audit --no-fund
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          find src test scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm run check:secrets

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - run: db/tests/run.sh
